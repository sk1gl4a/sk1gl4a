name: card

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: card
  cancel-in-progress: true

jobs:
  card:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Render the card
        run: python3 tools/card.py

      # commits made with GITHUB_TOKEN do not trigger workflows, so this
      # cannot loop back into the push trigger above
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md
          git diff --staged --quiet && echo 'nothing to commit' && exit 0
          git commit -m "card: $(date -u +%F)"
          git push
